[project]
name = "monitoramento-bgp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4", "confluent-kafka>=2.15"]

[tool.pytest.ini_options]
testpaths = ["testes"]
markers = [
    "integracao: exige o docker-compose no ar (broker Kafka)",
]
addopts = "-m 'not integracao'"

[tool.uv]
# O binding C do pybgpstream (fase 2) compila contra o Python da venv; ela tem
# que ser o Python do sistema, nunca um interpretador gerenciado pelo uv.
python-preference = "only-system"
